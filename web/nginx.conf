server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A API roda em outro serviço (uvicorn:8000). O nginx a expõe sob /api na
    # mesma origem, então o frontend não precisa de CORS nem de URL absoluta.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # O service worker não deve ser cacheado agressivamente, senão o PWA fica
    # preso numa versão antiga.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # SPA: qualquer rota desconhecida cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
