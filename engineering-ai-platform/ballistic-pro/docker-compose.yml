version: '3.8'

services:
  ballistic-pro:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - .data:/app/.streamlit
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/ballistic_db}
    restart: always
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ballistic_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

volumes:
  pg_data:
